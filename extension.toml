# HTML, CSS and SVG highlighting from Tree-sitter grammars compiled to
# WebAssembly, the language servers from vscode-langservers-extracted (see
# Flareite's docs/extensions.md#languages), and a live preview of HTML
# files beside their editor (src/lib.rs: a layout, API 1.15).
id = "flareite.html-css"
name = "HTML & CSS"
version = "0.2.0"
description = "HTML, CSS and SVG: highlighting (with CSS and JavaScript inside HTML and SVG), language servers, and a live preview of HTML files."
author = "Flareite"
api_version = "1"
entrypoint = "target/wasm32-unknown-unknown/release/html_css.wasm"

[engines]
flareite = ">=0.1.0"

# Flareite starts the servers below only once you allow this.
[permissions]
language_servers = true

[build]
command = "cargo"
args = ["build", "--release"]
watch = ["src", "Cargo.toml"]

[[commands]]
id = "flareite.html-css.preview"
title = "Show an HTML Page or Preview Tab"
hidden = true

# An HTML file's editor with the page beside it, as it's edited. Chosen with
# the button on an HTML file's tab, or View: Reopen Editor With...
[[layouts]]
id = "preview"
title = "HTML Preview"
command = "flareite.html-css.preview"
patterns = ["*.html", "*.htm", "*.xhtml"]
priority = "option"
icon = "preview"

# An HTML file's page by itself, in a tab of its own, as it's edited (in
# any tab). Chosen the same ways.
[[layouts]]
id = "page"
title = "HTML Page"
command = "flareite.html-css.preview"
patterns = ["*.html", "*.htm", "*.xhtml"]
priority = "option"
icon = "eye"

[[languages]]
# The id language servers, settings, and injections use.
id = "html"
name = "HTML"
file_extensions = ["html", "htm", "xhtml"]
# Built with `tree-sitter build --wasm`; exports `tree_sitter_html`.
grammar = "grammars/tree-sitter-html.wasm"
highlights = "queries/html/highlights.scm"
folds = "queries/html/folds.scm"
# Highlights <style> as CSS and <script> as JavaScript.
injections = "queries/html/injections.scm"
# No line comments: Toggle Line Comment wraps lines in a block comment.
block_comment = ["<!--", "-->"]

[[languages]]
id = "css"
name = "CSS"
file_extensions = ["css"]
grammar = "grammars/tree-sitter-css.wasm"
highlights = "queries/css/highlights.scm"
folds = "queries/css/folds.scm"
block_comment = ["/*", "*/"]

[[languages]]
id = "svg"
name = "SVG"
file_extensions = ["svg"]
# SVG is XML: the prebuilt tree-sitter-xml grammar, which exports
# `tree_sitter_xml`.
grammar = "grammars/tree-sitter-xml.wasm"
grammar_name = "xml"
highlights = "queries/svg/highlights.scm"
folds = "queries/svg/folds.scm"
# Highlights <style> as CSS and <script> as JavaScript.
injections = "queries/svg/injections.scm"
block_comment = ["<!--", "-->"]

# `npm install -g vscode-langservers-extracted` provides both servers. Flareite
# looks for them on the PATH and shows "not installed" in the status bar if
# they're missing; highlighting works either way.
[[language_servers]]
name = "vscode-html-language-server"
command = "vscode-html-language-server"
args = ["--stdio"]
languages = ["html"]
root_markers = ["package.json"]

[[language_servers]]
name = "vscode-css-language-server"
command = "vscode-css-language-server"
args = ["--stdio"]
languages = ["css"]
root_markers = ["package.json"]
